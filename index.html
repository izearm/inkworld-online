<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f8f4ea">
<link rel="icon" href="data:,">
<title>Paper Dungeon: Ink World</title>
</head>
<body>
<div id="game">
  <div id="stage"></div>

  <!-- HUD -->
  <div id="hud" class="hidden">
    <div id="hud-left">
      <div id="status" class="sketch">
        <div class="lvrow"><span class="lv">Lv <b id="lv">1</b></span><span id="landmood"></span></div>
        <div class="bar hp"><i id="hpbar"></i><span id="hptxt"></span></div>
        <div class="bar ink"><i id="inkbar"></i><span id="inktxt"></span></div>
        <div class="bar exp"><i id="expbar"></i></div>
        <div id="poison-status" class="hidden" role="img" aria-label="ติดพิษ"><span class="poison-skull" aria-hidden="true">&#9760;</span><span class="poison-pixels" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span></div>
      </div>
      <div id="menu">
        <span class="lumi-chip" title="เงิน Lumi"><span class="coin"></span><b id="lumicnt">0</b></span>
        <button class="mbtn" data-panel="equip" title="สวมใส่">สวมใส่</button>
        <button class="mbtn" data-panel="bag" title="กระเป๋า (I)">กระเป๋า</button>
        <button class="mbtn" data-panel="skills" title="สกิล (K)">สกิล<em id="sp-badge" class="badge hidden">0</em></button>
        <button class="mbtn" data-panel="status" title="สถานะ (C)">สถานะ</button>
        <button class="mbtn" data-panel="quest" title="เควส (L)">เควส</button>
        <button class="mbtn" data-panel="world" title="แผนที่โลก (M)">โลก<em id="page-badge" class="badge hidden">!</em></button>
        <button class="mbtn" data-panel="pause" title="หยุด (P)">⏸</button>
      </div>
      <div id="tracker"></div>
      <div id="lvup" class="hidden"></div>
    </div>
    <div id="mapname"></div>
    <div id="tgt" class="hidden"><div class="tn"></div><div class="tb"><i></i></div></div>
    <div id="portal-label" class="hidden"></div>
    <div id="bossbar" class="hidden"><div class="bn"><span></span><b class="bx"></b></div><div class="bb"><i></i></div></div>
  </div>

  <!-- Controls -->
  <div id="controls" class="hidden">
    <div id="joy-zone"><div id="joy"><div id="joy-knob"></div></div></div>
    <div id="rbtns">
      <button id="btn-act" class="hidden">คุย</button>
      <button id="btn-potion" class="sbtn hk" title="ไอเท็มใช้งาน: ยา (Q)"><span class="ic">ยา</span><span class="potion-mask" aria-hidden="true"><span class="cdv"></span></span><span class="potion-time" aria-hidden="true"></span><b id="potcnt">0</b></button>
      <button id="btn-potion-2" class="sbtn hk" title="ไอเท็มใช้งานช่อง 2 (R)"><span class="ic">ยา</span><span class="potion-mask" aria-hidden="true"><span class="cdv"></span></span><span class="potion-time" aria-hidden="true"></span><b id="potcnt2">0</b></button>
      <button id="btn-s2" class="sbtn"><span class="ic"></span><span class="cdv"></span><span class="skill-time" aria-hidden="true"></span></button>
      <button id="btn-s1" class="sbtn"><span class="ic"></span><span class="cdv"></span><span class="skill-time" aria-hidden="true"></span></button>
      <button id="btn-s0" class="sbtn"><span class="ic"></span><span class="cdv"></span><span class="skill-time" aria-hidden="true"></span></button>
      <button id="btn-attack" aria-label="โจมตี" title="โจมตี (J)"><svg viewBox="0 0 48 48" width="46" height="46" fill="none" stroke="#1b1b1b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M10 38 L34 13 L38 9 L37 14 L12 40 Z"/><path d="M8 32 L16 40"/><path d="M6 42 L10 38"/><path d="M27 15 Q36 19 34 30" stroke-dasharray="3 4" stroke-width="2"/></svg></button>
    </div>
  </div>

  <div id="hint" class="hidden"><span class="nibface"></span><span id="hinttxt"></span></div>
  <div id="toasts"></div>
  <div id="dialog" class="hidden"><div class="who"></div><div class="txt"></div><div class="more">▼ แตะเพื่อไปต่อ</div></div>
  <div id="panel" class="hidden"><div class="pbox sketch"><div class="phead"><b class="ptitle"></b><small class="pver hidden"></small><span class="phr"><b class="pdps hidden"></b><button class="pclose">✕</button></span></div><div class="pbody"></div></div></div>
  <div id="confirm" class="hidden"><div class="cbox sketch"><div class="cq"></div><div class="btnrow"><button id="cf-yes">ตกลง</button><button id="cf-no">ยกเลิก</button></div></div></div>
  <div id="overlay"></div>
  <div id="rotate" class="hidden">หมุนจอเป็นแนวนอนเพื่อเล่นได้ดีที่สุด <button id="rotate-x">เล่นแนวตั้ง</button></div>
  <!-- Audio -->
  <audio id="bgm" loop preload="none"></audio>
  <div id="sfx-pool"></div>
</div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
