# Render Blueprint — เว็บเกม + เซิร์ฟเวอร์ออนไลน์ + ฐานข้อมูล (บัญชีและเซฟ)
services:
  - type: web
    name: inkworld-online
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: INVITE_CODES        # รหัสเชิญ (คั่นด้วย ,) Render จะถามตอนสร้าง
        sync: false
      - key: ALLOWED_ORIGINS     # โดเมน GitHub Pages เช่น https://yourname.github.io (เว้นว่างได้)
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: inkworld-db
          property: connectionString
databases:
  - name: inkworld-db
    plan: free
