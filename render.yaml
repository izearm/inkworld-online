# Render Blueprint — เว็บเกม + เซิร์ฟเวอร์ออนไลน์
# ฐานข้อมูล: ใช้ Postgres ตัวที่มีอยู่แล้วในบัญชี (แพ็กฟรีมีได้ตัวเดียว)
#   → ใส่ DATABASE_URL = "Internal Database URL" ของฐานข้อมูลนั้น ตอน Render ถามค่า
services:
  - type: web
    name: inkworld-online
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: INVITE_CODES        # รหัสเชิญ (คั่นด้วย ,)
        sync: false
      - key: ALLOWED_ORIGINS     # https://izearm.github.io
        sync: false
      - key: DATABASE_URL        # Internal Database URL ของ Postgres ที่มีอยู่
        sync: false
